name: Adverse-condition detection benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-smoke.yml"
      - "src/**"
      - "tools/**"
      - "configs/**"
      - "pyproject.toml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Run COCO8 smoke benchmark
        run: python tools/run_smoke_benchmark.py --config configs/coco8_smoke.yaml

      - name: Run COCO128 robustness baseline
        run: python tools/run_smoke_benchmark.py --config configs/coco128_baseline.yaml

      - name: Show COCO128 outputs
        run: |
          echo "Condition metrics:"
          cat results/coco128_baseline/condition_metrics.csv
          echo "Robustness summary:"
          cat results/coco128_baseline/robustness_summary.csv
          echo "Metadata:"
          cat results/coco128_baseline/run_metadata.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adverse-condition-detection-benchmarks
          path: |
            results/coco8_smoke/condition_metrics.csv
            results/coco8_smoke/robustness_summary.csv
            results/coco8_smoke/map50_95_by_condition.png
            results/coco8_smoke/run_metadata.json
            results/coco128_baseline/condition_metrics.csv
            results/coco128_baseline/robustness_summary.csv
            results/coco128_baseline/map50_95_by_condition.png
            results/coco128_baseline/run_metadata.json
          retention-days: 14
