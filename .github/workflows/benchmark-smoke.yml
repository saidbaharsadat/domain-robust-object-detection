name: Adverse-condition detection smoke benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-smoke.yml"
      - "src/**"
      - "tools/**"
      - "configs/**"
      - "pyproject.toml"

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Run COCO8 adverse-condition benchmark
        run: python tools/run_smoke_benchmark.py --config configs/coco8_smoke.yaml

      - name: Show benchmark outputs
        run: |
          echo "Condition metrics:"
          cat results/coco8_smoke/condition_metrics.csv
          echo "Robustness summary:"
          cat results/coco8_smoke/robustness_summary.csv
          echo "Metadata:"
          cat results/coco8_smoke/run_metadata.json

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coco8-adverse-condition-smoke-benchmark
          path: |
            results/coco8_smoke/condition_metrics.csv
            results/coco8_smoke/robustness_summary.csv
            results/coco8_smoke/map50_95_by_condition.png
            results/coco8_smoke/run_metadata.json
          retention-days: 14
