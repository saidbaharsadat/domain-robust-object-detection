[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-robust-object-detection"
version = "0.2.0"
description = "Object-detection robustness experiments under controlled adverse visual conditions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Said Bahar Sadat"}]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "ultralytics>=8.3"
]

[tool.setuptools.packages.find]
where = ["src"]
